name: INR-RUB Rate Tracker

on:
  schedule:
    # Har ghante chalane ke liye (Minutes, Hours, Day, Month, Day of week)
    - cron: '0 * * * *'
  workflow_dispatch: # Taaki aap manual bhi button daba kar test kar sako

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Tracker Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python test.py

    - name: Commit and Push Last Rate Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add last_rate.txt
        git commit -m "Update last tracked rate [skip ci]" || exit 0
        git push
