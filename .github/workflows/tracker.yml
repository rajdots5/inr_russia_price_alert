name: INR-RUB Rate Tracker Bot

on:
  schedule:
    # Runs automatically at the start of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to manually click a button on GitHub to test it

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repository Repository Data
      uses: actions/checkout@v4

    - name: Initialize Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Project Requirements
      run: pip install -r requirements.txt

    - name: Execute Check & Process Alerts
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python test.py

    - name: Save Updated Baseline State to Repo
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add last_rate.txt
        git commit -m "System: Log modern rate baseline [skip ci]" || exit 0
        git push
